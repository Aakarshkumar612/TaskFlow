services:
  # ────────────────────────────────────────────
  # Backend API Service
  # ────────────────────────────────────────────
  - type: web
    name: taskflow-backend
    runtime: node
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: PORT
        value: 5000

  # ────────────────────────────────────────────
  # Frontend Static Site
  # ────────────────────────────────────────────
  - type: web
    name: taskflow-frontend
    runtime: static
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: taskflow-backend
          type: web
          property: url
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false

  # ────────────────────────────────────────────
  # PostgreSQL Database
  # ────────────────────────────────────────────
  - type: pserv
    name: taskflow-db
    plan: free
    region: oregon
