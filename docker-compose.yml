# ──────────────────────────────────────────────
# TASKFLOW - Docker Compose
#
# Services:
#   - PostgreSQL (database)
#   - Backend API (Node.js/Express)
#   - Frontend (React/Vite served via Nginx)
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose logs -f        # View logs
#   docker compose down           # Stop all services
#   docker compose down -v        # Stop + remove volumes (deletes DB data)
# ──────────────────────────────────────────────

services:
  # ────────────────────────────────────────────
  # PostgreSQL Database
  # ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - taskflow-network

  # ────────────────────────────────────────────
  # Backend API
  # ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow-backend
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/taskflow
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: taskflow
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      # Server
      PORT: 5000
      FRONTEND_URL: http://localhost:3000
      # Clerk
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-sk_test_6Y1LQ3ncuymPq1QCu3oM4d6OuJvWMtGo319GyCx12Q}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-pk_test_cmVsZXZhbnQtdGFycG9uLTY1LmNsZXJrLmFjY291bnRzLmRldiQ}
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/prisma:/app/prisma
    networks:
      - taskflow-network

  # ────────────────────────────────────────────
  # Frontend (React + Vite via Nginx)
  # ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskflow-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - taskflow-network

# ────────────────────────────────────────────
# Named volumes (persistent data)
# ────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local

# ────────────────────────────────────────────
# Networks
# ────────────────────────────────────────────
networks:
  taskflow-network:
    driver: bridge
